name: Engine

# The engine is pure Swift and has no Xcode project, so this workflow is the fast,
# strict one: it builds AuroraCore and the CLI, then runs the test suite. The app
# and the .deb packaging live in app-build.yml.
#
# The tests are only meaningful on macOS because decompression goes through
# Apple's Compression framework (the xz indexes) and hashing through CryptoKit.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'App/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'App/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/**/*.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-
            swiftpm-${{ runner.os }}-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --parallel

      - name: Smoke-test the CLI
        run: |
          set -euo pipefail
          .build/debug/aurora version
          .build/debug/aurora env
          .build/debug/aurora help | head -5
          .build/debug/aurora deb Tests/AuroraCoreTests/Fixtures/packages/aurora-fixture_1.2.3-1_iphoneos-arm64.deb

      - name: Install dpkg (fixture tooling and the ordering oracle)
        run: |
          # Both checks below are no-ops without the real tools: they rebuild the
          # fixtures with dpkg-deb and re-derive the version-ordering vectors by
          # asking dpkg itself. Homebrew's dpkg is the Debian implementation, so
          # the oracle is independent of AuroraCore's own code.
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            brew install dpkg
          fi
          dpkg --version | head -1

      - name: Regenerate fixtures and check they are unchanged
        run: |
          set -euo pipefail
          command -v dpkg-deb >/dev/null 2>&1 || { echo "::error::dpkg-deb is missing"; exit 1; }
          cp -R Tests/AuroraCoreTests/Fixtures /tmp/fixtures-before
          python3 Tools/make_fixtures.py >/dev/null
          diff -r /tmp/fixtures-before Tests/AuroraCoreTests/Fixtures
          echo "fixtures are reproducible

      - name: Verify the version oracle still agrees with dpkg
        run: |
          set -euo pipefail
          command -v dpkg >/dev/null 2>&1 || { echo "::error::dpkg is missing"; exit 1; }
          python3 Tools/fuzz_version_order.py
