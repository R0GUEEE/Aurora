name: Engine

# The engine is pure Swift and has no Xcode project, so this workflow is the fast,
# strict one: it builds AuroraCore and the CLI, then runs the test suite. The app
# and the .deb packaging live in app-build.yml.
#
# The tests are only meaningful on macOS because decompression goes through
# Apple's Compression framework (the xz indexes) and hashing through CryptoKit.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'App/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'App/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/**/*.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-
            swiftpm-${{ runner.os }}-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --parallel

      - name: Smoke-test the CLI
        run: |
          set -euo pipefail
          .build/debug/aurora version
          .build/debug/aurora env
          .build/debug/aurora help | head -5
          .build/debug/aurora deb Tests/AuroraCoreTests/Fixtures/packages/aurora-fixture_1.2.3-1_iphoneos-arm64.deb

      - name: Regenerate fixtures and check they are unchanged
        run: |
          set -euo pipefail
          if command -v dpkg-deb >/dev/null 2>&1; then
            cp -R Tests/AuroraCoreTests/Fixtures /tmp/fixtures-before
            python3 Tools/make_fixtures.py >/dev/null
            diff -r /tmp/fixtures-before Tests/AuroraCoreTests/Fixtures && echo "fixtures are reproducible"
          else
            echo "::notice::dpkg-deb is unavailable, skipping the fixture reproducibility check"
          fi

      - name: Verify the version oracle still agrees with dpkg
        run: |
          set -euo pipefail
          if command -v dpkg >/dev/null 2>&1; then
            python3 Tools/fuzz_version_order.py
          else
            echo "::notice::dpkg is unavailable, skipping the oracle check"
          fi
